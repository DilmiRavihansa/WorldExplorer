# World Explorer configuration
# REST Countries API key (get one free at https://restcountries.com/sign-up)
api.key=rc_live_c2fd44c8db284633b86f56daa94756ca
# API base URL (normally leave as is)
api.base.url=https://api.restcountries.com/countries/v5

# Bonus round using the Fish API (Count the Fish)
bonus.enabled=true
# a bonus round appears after every N country questions
bonus.every=5
bonus.points=20
fish.api.url=https://marcconrad.com/uob/fish/api.php?out=csv&base64=yes

# Round settings
# number of country questions in one round (bonus rounds are not counted)
round.length=15
# seconds allowed per question (0 = no timer)
question.seconds=20
# the leaderboard is also written here as JSON so other programs can read it
leaderboard.json=leaderboard.json